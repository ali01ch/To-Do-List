<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a7a4c" />
    <meta name="description" content="روزنو؛ مدیریت کار روی همین دستگاه." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="روزنو" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>روزنو</title>
    <script>
      try {
        var stored = localStorage.getItem('rozno-theme')
        var palette = localStorage.getItem('rozno-palette')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        if (palette === 'rose') document.documentElement.classList.add('palette-rose')
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        var themeMeta = document.querySelector('meta[name="theme-color"]')
        if (themeMeta) {
          var lightColor = palette === 'rose' ? '#c45c7a' : '#1a7a4c'
          var darkColor = palette === 'rose' ? '#160f12' : '#0c1511'
          themeMeta.setAttribute('content', dark ? darkColor : lightColor)
        }
      } catch (error) {
        /* Appearance falls back to the light theme if storage is blocked. */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
